[project]
name = "fibonacci-kata"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Arenion", email = "nicolas.michel.vannereux@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fibonacci-tdd-kata = "fibonacci_tdd_kata:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "marimo>=0.24.2",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.6",
    "pytest-cov">="8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]


